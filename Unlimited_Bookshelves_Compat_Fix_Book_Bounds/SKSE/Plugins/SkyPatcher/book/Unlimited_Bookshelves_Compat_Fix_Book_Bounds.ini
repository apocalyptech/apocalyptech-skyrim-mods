;;; Unlimited Bookshelves Compat - Fix Book Bounds v1.2.0
;;;
;;; There are occasionally books which don't have their Object Bounds (OBND)
;;; data set, or the data set incorrectly, which can lead to weirdness when
;;; trying to display those books using the Unlimited Bookshelves mod.
;;; USSEP has been steadily fixing those up, but other book-related mods like
;;; Book Covers Skyrim (and its USSEP compat patch) are often slower to
;;; update.  And of course some folks don't want to use USSEP in the first
;;; place.
;;;
;;; This mod exists to patch up those bounds, so that folks can enjoy their
;;; nicely organized bookshelves without weird book clipping or empty spaces.
;;;
;;; Released under CC0 (Public Domain)
;;; https://creativecommons.org/public-domain/cc0/

;;;
;;; These five had their bounds changed improperly in some past version of
;;; USSEP, but were fixed up in USSEP v4.3.7, released 2026-02-15.  As of
;;; April 2026, the mods "Book Covers Skyrim" and its "USSEP Update" patch
;;; have not yet been updated to reflect these fixes, though, so I'm leaving
;;; them in here.
;;;
;;; USSEP Report: https://afktrack.afkmods.com/index.php?a=issues&i=36209
;;; (original report just included the first three, but USSEP identified the
;;; other two)
;;;
;;; BCS - USSEP Update Report:
;;; https://www.nexusmods.com/skyrimspecialedition/mods/50615?tab=posts&comment_id=166735315
;;;

; The Book of Daedra
filterByBooks=Skyrim.esm|01ACC8:minX=-11:minY=-15:minZ=-3:maxX=11:maxY=15:maxZ=3

; The Real Barenziah, Vol. 2
filterByBooks=Skyrim.esm|01ACD7:minX=-11:minY=-15:minZ=-3:maxX=11:maxY=15:maxZ=3

; The Wolf Queen, Vol. 4
filterByBooks=Skyrim.esm|01B00B:minX=-11:minY=-15:minZ=-3:maxX=11:maxY=15:maxZ=3

; Immortal Blood
filterByBooks=Skyrim.esm|01AFF1:minX=-9:minY=-11:minZ=-1:maxX=9:maxY=11:maxZ=2

; Totems of Hircine
filterByBooks=Skyrim.esm|0F6840:minX=-11:minY=-15:minZ=-3:maxX=11:maxY=14:maxZ=3

